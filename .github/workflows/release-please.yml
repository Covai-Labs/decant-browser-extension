name: Release Please & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Select browser target to publish (or build only)'
        required: true
        default: 'none'
        type: choice
        options:
          - all
          - firefox
          - chrome
          - edge
          - none

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    name: Build & Package Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run lint & formatting checks
        run: |
          npm run lint
          npm run format:check

      - name: Run Unit Tests
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Package Extension ZIPs
        run: |
          npm run package
          cd releases
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: releases/

      - name: Attach Extension ZIPs to GitHub Release
        if: needs.release-please.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            releases/*.zip
            releases/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-firefox:
    name: Publish to Firefox AMO
    needs: [release-please, build-and-release]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'firefox'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Package Firefox Extension
        run: npm run build:firefox && python3 package.py

      - name: Publish to Firefox Add-ons (AMO)
        run: |
          npx web-ext sign \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel="listed" \
            --source-dir=".output/firefox-mv3" \
            --approval-timeout 0

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: [release-please, build-and-release]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-chrome-store
      cancel-in-progress: false
    if: |
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'chrome'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-zips
          path: releases/

      - name: Publish to Chrome Web Store
        run: node publish-chrome.js
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_ZIP_PATH: releases/decant-chromium.zip

  publish-edge:
    name: Publish to Microsoft Edge Add-ons
    needs: [release-please, build-and-release]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'edge'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: extension-zips
          path: releases/

      - name: Publish to Microsoft Edge Add-ons
        run: node publish-edge.js
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_ZIP_PATH: releases/decant-chromium.zip
