<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="actionTitle">__MSG_actionTitle__</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">🍷 <span>Decant</span></div>
      <div class="header-actions">
        <button id="options-btn" title="Settings" data-i18n-title="optionsTitle">⚙️</button>
      </div>
    </div>

    <div class="content-container">
      <!-- Loading -->
      <div id="loading" class="state-view">
        <div class="spinner"></div>
        <p data-i18n="decantingPage">Decanting page…</p>
      </div>

      <!-- Error -->
      <div id="error-view" class="state-view hidden">
        <p class="error-msg" id="error-text" data-i18n="couldNotExtract">
          Could not extract content from this page.
        </p>
      </div>

      <!-- Success -->
      <div id="success-view" class="state-view hidden">
        <div class="success-icon">✓</div>
        <p class="success-title" id="success-title">Article Title</p>
        <p class="success-sub" id="success-sub" data-i18n="decantedReady">
          Decanted · ready to export
        </p>
      </div>
    </div>

    <!-- Row 1: AI Transfer -->
    <div class="actions row-ai">
      <select id="ai-select" class="select-dropdown" title="Select AI Platform">
        <option value="chatgpt">ChatGPT</option>
        <option value="claude">Claude</option>
        <option value="gemini">Gemini</option>
        <option value="deepseek">DeepSeek</option>
        <option value="perplexity">Perplexity</option>
        <option value="qwen">Qwen</option>
        <option value="mistral">Mistral</option>
        <option value="lumo">Lumo</option>
        <option value="copilot">Copilot</option>
        <option value="meta">Meta AI</option>
        <option value="z_ai">Z.ai</option>
        <option value="grok">Grok</option>
      </select>
      <button
        id="ai-btn"
        class="btn ai-btn"
        title="Send article prompt to AI Chat"
        data-i18n="sendToAi"
      >
        🤖 Send to AI
      </button>
    </div>

    <!-- Row 2: PKM / App Transfer -->
    <div class="actions row-app">
      <select id="app-select" class="select-dropdown" title="Select PKM / Note App">
        <option value="obsidian">Obsidian</option>
        <option value="logseq">Logseq</option>
        <option value="bear">Bear</option>
        <option value="noteplan">NotePlan</option>
        <option value="drafts">Drafts</option>
      </select>
      <button
        id="obsidian-btn"
        class="btn accent"
        title="Open clip in PKM app"
        data-i18n="openInObsidian"
      >
        Open in Obsidian
      </button>
    </div>

    <hr class="popup-divider" />

    <!-- Row 3: Format Selection & Markdown Actions -->
    <div class="actions row-format">
      <select id="format-select" class="select-dropdown format-select" title="Export Format">
        <option value="md" selected>Markdown (.md)</option>
        <option value="html">HTML (.html)</option>
        <option value="json">JSON (.json)</option>
        <option value="doc">Word (.doc)</option>
        <option value="pdf">PDF (.pdf)</option>
        <option value="png">PNG (.png)</option>
      </select>

      <div id="md-actions" class="format-action-group">
        <button
          id="copy-btn"
          class="btn primary"
          title="Copy Markdown to clipboard (Alt+Shift+C)"
          data-i18n="copyButton"
        >
          📋 Copy
        </button>
        <button
          id="download-md-btn"
          class="btn primary"
          title="Download Markdown file (Alt+Shift+D)"
          data-i18n="saveButton"
        >
          ⬇ Save
        </button>
      </div>
    </div>

    <!-- Row 4: Preview -->
    <div id="preview-actions" class="actions row-preview">
      <button
        id="export-btn"
        class="btn export-btn"
        title="Open the selected format preview in a new tab"
        data-i18n="previewButton"
      >
        🔍 Preview in new tab
      </button>
    </div>

    <!-- Row 5: Batch Multi-Tab Clipping -->
    <div class="batch-section">
      <div class="batch-control-group">
        <select
          id="batch-mode-select"
          class="select-dropdown batch-select"
          title="Batch Export Mode"
        >
          <option value="zip" selected data-i18n="batchModeZip">📦 ZIP Archive (.zip)</option>
          <option value="combined" data-i18n="batchModeCombined">📑 Combined Note (.md)</option>
          <option value="separate" data-i18n="batchModeSeparate">📂 Separate Files (.md)</option>
        </select>
        <button
          id="clip-all-btn"
          class="btn batch-btn"
          title="Clip all open tabs in this window (Alt+Shift+A)"
        >
          <span data-i18n="clipAllTabs">Clip All Tabs</span>
          <span id="tab-count-badge" class="badge">...</span>
        </button>
      </div>
      <div id="batch-progress-container" class="batch-progress-container hidden">
        <div class="batch-progress-bar">
          <div id="batch-progress-fill" class="batch-progress-fill" style="width: 0%"></div>
        </div>
        <span id="batch-progress-text" class="batch-progress-text">Clipping tabs...</span>
      </div>
    </div>

    <div id="png-warning-banner" class="png-warning-banner hidden" data-i18n="pngWarning">
      ⚠️ PNG export on long articles may take a few moments. Consider PDF or Markdown for instant
      export.
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
