        function setupDecantWave() {
          var canvas = document.getElementById('decant-wave');
          if (!canvas) return;
          if (canvas.dataset.waveInit === '1') return;
          canvas.dataset.waveInit = '1';
          var ctx = canvas.getContext('2d');

          var height = 0;
          var time = 0;

                height / 2 +
                Math.sin(x2 * 0.007 + time) * 26 +
                Math.sin(x2 * 0.018 + time * 1.5) * 12;
              if (x2 === 0) ctx.moveTo(x2, y2);
              else ctx.lineTo(x2, y2);
            }
            ctx.stroke();
          }

          function animate() {
            if (!document.hidden) {
              drawFrame();
              time += 0.035;
            }
            animId = requestAnimationFrame(animate);
          }

          window.addEventListener('resize', resize);
          document.addEventListener('visibilitychange', function () {
            if (!reducedMotion && !document.hidden && !animId) animate();
          });
          document.addEventListener('astro:page-load', function () {
            resize();
          });
          resize();

          if (reducedMotion) {
            drawFrame();
            return;
          }
          animate();
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupDecantWave);
        } else {
          setupDecantWave();
        }
        document.addEventListener('astro:page-load', setupDecantWave);
      })();
    </script>

        <script>
          (function () {
            const root = document.documentElement;
            const buttons = Array.from(
              document.querySelectorAll('.theme-toggle button[data-theme]'),
            );
            if (!buttons.length) return;

            function getStored() {
              try {
                const t = localStorage.getItem('decant-theme');
                return t === 'dark' || t === 'light' ? t : 'system';
              } catch (e) {
                return 'system';
              }
            }

            function apply(theme) {
              if (theme === 'light' || theme === 'dark') {
                root.dataset.theme = theme;
              } else {
                delete root.dataset.theme; // fall back to prefers-color-scheme in CSS
              }
              try {
                localStorage.setItem('decant-theme', theme);
              } catch (e) {
                /* private mode */
              }
              buttons.forEach((b) => {
                b.setAttribute('aria-pressed', String(b.dataset.theme === theme));
              });
            }

            apply(getStored());

            buttons.forEach((b) => {
              b.addEventListener('click', () => apply(b.dataset.theme));
            });
          })();
        </script>
