# SonarCloud configuration for Automatic Analysis

# Exclude documentation, web site, and build outputs from analysis
sonar.exclusions=docs/**,web/**,releases/**,store-assets/**,dist/**,dist-firefox/**,.output/**,.wxt/**,Scratch/**

# Exclude tests, entrypoints, and web assets from code duplication (CPD) checks
sonar.cpd.exclusions=tests/**,docs/**,web/**,entrypoints/**,public/**
